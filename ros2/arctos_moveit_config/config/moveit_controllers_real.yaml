# MoveIt controller configuration for real hardware.
# The real-hardware path now exposes the full 6-DOF arm, including the
# differential wrist (motors 5 and 6 mapped to joints 5 and 6 in software).
moveit_simple_controller_manager:
  controller_names:
    - arctos_arm_controller

  arctos_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
