# MoveIt controller configuration for real hardware.
# Joints 5-6 are intentionally excluded because the differential wrist
# is not yet stable enough for production execution on the physical arm.
moveit_simple_controller_manager:
  controller_names:
    - arctos_arm_controller
    - gripper_controller

  arctos_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - jaw1
      - jaw2
