# Arctos Controllers Configuration
# ros2_control controller configuration for Arctos robot

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    
    # List of controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    arctos_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# Joint State Broadcaster Configuration
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    
    interfaces:
      - position
      - velocity


# Joint Trajectory Controller Configuration
arctos_arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    
    # Command interfaces
    command_interfaces:
      - position
    
    # State interfaces
    state_interfaces:
      - position
      - velocity
    
    # Allow partial joints in commands
    allow_partial_joints_goal: true
    
    # Allow integration of velocity into position
    allow_integration_in_goal_trajectories: true
    
    # Action server settings
    action_monitor_rate: 20.0  # Hz
    
    # Trajectory constraints
    constraints:
      stopped_velocity_tolerance: 0.01  # rad/s
      goal_time: 0.0  # 0 = infinite
      
      # Per-joint goal tolerances
      joint1:
        goal: 0.05
        trajectory: 0.1
      joint2:
        goal: 0.05
        trajectory: 0.1
      joint3:
        goal: 0.05
        trajectory: 0.1
      joint4:
        goal: 0.05
        trajectory: 0.1
      joint5:
        goal: 0.05
        trajectory: 0.1
      joint6:
        goal: 0.05
        trajectory: 0.1
    
    # State publish rate
    state_publish_rate: 50.0  # Hz
    
    # Action server tolerances
    allow_nonzero_velocity_at_trajectory_end: true
    
    # Gains (if using effort interface, not position)
    # gains:
    #   joint1: {p: 100.0, i: 0.0, d: 10.0}
    #   joint2: {p: 100.0, i: 0.0, d: 10.0}
    #   joint3: {p: 100.0, i: 0.0, d: 10.0}
    #   joint4: {p: 100.0, i: 0.0, d: 10.0}
    #   joint5: {p: 50.0, i: 0.0, d: 5.0}
    #   joint6: {p: 50.0, i: 0.0, d: 5.0}


# Forward Position Controller (alternative)
forward_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    
    interface_name: position
